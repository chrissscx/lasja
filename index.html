<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Füüsika KT kordamine</title>
<meta name="description" content="Interaktiivne harjutusleht füüsika kontrolltööks: Füüs. ül. kogu I ülesanded sammhaaval.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4e79'/%3E%3Cpath d='M6 24 L26 8' stroke='white' stroke-width='3'/%3E%3Cpath d='M26 8 l-7 1 l6 6z' fill='white'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <button class="iconbtn only-mobile" id="btnList" aria-label="Ülesannete nimekiri">☰</button>
  <div class="brand">
    <span class="brand-title">Füüsika KT kordamine</span>
    <span class="brand-sub">Füüs. ül. kogu I · mehaanika</span>
  </div>
  <div class="stats" id="stats"></div>
  <button class="btn ghost" id="btnFormulas">Valemid</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-section">
      <div class="side-label">Teemad</div>
      <div class="chips" id="fBlocks"></div>
    </div>
    <div class="side-section">
      <div class="side-label">Ülesande tüüp</div>
      <div class="chips" id="fKinds"></div>
    </div>
    <div class="side-section">
      <div class="side-label">Näita</div>
      <div class="chips" id="fStatus"></div>
    </div>
    <div class="side-section row">
      <label class="switch"><input type="checkbox" id="fRandom" checked> <span>Juhuslik järjekord</span></label>
    </div>
    <div class="side-section">
      <div class="side-label" id="listLabel">Ülesanded</div>
      <ol class="plist" id="plist"></ol>
    </div>
    <div class="side-section small muted">
      <button class="linkbtn" id="btnReset">Kustuta kõik tulemused</button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-panel">
    <div class="drawer-head">
      <strong>Valemid (konspektist)</strong>
      <button class="iconbtn" id="btnCloseDrawer" aria-label="Sulge">✕</button>
    </div>
    <div class="drawer-tabs" id="drawerTabs"></div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="js/core.js"></script>
<script src="js/data/b1.js"></script>
<script src="js/data/b2.js"></script>
<script src="js/data/b3.js"></script>
<script src="js/data/b4.js"></script>
<script src="js/data/b5.js"></script>
<script src="js/data/b6.js"></script>
<script src="js/data/b7.js"></script>
<script src="js/formulas.js"></script>
<script src="js/forces.js"></script>
<script src="js/app.js"></script>
</body>
</html>
